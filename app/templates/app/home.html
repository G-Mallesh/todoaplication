<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Aplication</title>
     <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    >
</head>
<body>
    <div>
        <h3>Todo Aplicaion</h3>
        <h4>Date</h4>
        <div class="row">
        <p> {% now "jS F Y" %}</p>
    
    <div class="col-md-7 col-lg-7" style="height: 400px">
        {% for task in tasks %}
    <div class="card">
        <div class="card-body">
            {{task.task}}
            <span style="position:relative;float:right;">
            <a href="{% url 'complete' task.id %}" class="btn btn-success"><i class="bi bi-check-circle"></i>Mark as Done</a>
            <a href="{% url 'deleteData' task.id %}" class="btn btn-danger"><i class="bi bi-trash"></i>Delete</a>
            <a href="{% url 'updateData' task.id %}" class="btn btn-primary"><i class="bi bi-pencil-square"></i>Update</a>
            </span>
        </div>
    </div>
    {% endfor %}
    </div>
    <div class="col-md-5">
        <h5>Completed Tasks</h5>
        {% for task in completed_tasks %}
        <div class="card">
            <div class="card-body">
               
            {{task.task}}
          <span style="position:relative;float:right;">
            <a href="{% url 'incomplete' task.id %}" class="btn btn-success"><i class="bi bi-check-circle"></i>Mark as Undone</a>
            <a href="{% url 'deleteData' task.id %}" class="btn btn-danger"><i class="bi bi-trash"></i>Delete</a>
            <a href="{% url 'updateData' task.id %}" class="btn btn-primary"><i class="bi bi-pencil-square"></i>Update</a>
            </span>
             
            </div>
        </div>
        {% endfor %}
    </div>
 </div>
 </div>
 <div class="container">

 <div class="row">
    <div class="col-md-6" style="position:absolute;bottom:50px;">
        <form action="{% url 'addTask' %}" method="POST">
            {% csrf_token %}
            <span style="display:flex;">
                <input type="text" class="form-control" placeholder="Add a Task" name="task">
                <button type="submit" class="btn btn-primary" style="width:200px"><i class="bi bi-plus-square"></i>Add</button>
            </span>
        </form>
        </div>
    </div>
 </div>
</body>
</html>
